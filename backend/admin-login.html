<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — WiseFind</title>
<meta name="robots" content="noindex, nofollow">

<!-- Bootstrap (same version used on the main site) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    :root { --brand: #4e66ea; --brand-dark: #3648c4; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: linear-gradient(135deg, #171c26 0%, #2a3352 55%, var(--brand) 130%);
        padding: 20px;
    }

    .admin-login-card {
        width: 100%;
        max-width: 400px;
        background: #fff;
        border-radius: 16px;
        padding: 36px 32px;
        box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }

    .admin-login-card .icon-badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: rgba(78,102,234,.12);
        color: var(--brand);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        margin-bottom: 16px;
    }

    .admin-login-card h1 {
        font-size: 1.4rem;
        font-weight: 700;
        color: #171c26;
        margin-bottom: 4px;
    }

    .admin-login-card p.subtitle {
        color: #777;
        font-size: .88rem;
        margin-bottom: 24px;
    }

    .form-label { font-weight: 600; font-size: .88rem; }

    .btn-primary {
        background: var(--brand);
        border-color: var(--brand);
        padding: 10px 0;
        font-weight: 600;
    }

    .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: rgba(255,255,255,.85);
        text-decoration: none;
        font-size: .9rem;
        margin-bottom: 18px;
    }

    .back-link:hover { color: #fff; }

    #adminLoginError {
        display: none;
        background: #fdecea;
        color: #b3261e;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: .85rem;
        margin-bottom: 16px;
    }

    .wrap { width: 100%; max-width: 400px; }
</style>
</head>
<body>

<div class="wrap">
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to WiseFind</a>

    <div class="admin-login-card">
        <div class="icon-badge"><i class="fas fa-user-shield"></i></div>
        <h1>Admin Login</h1>
        <p class="subtitle">This page is only for WiseFind administrators.</p>

        <div id="adminLoginError"></div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control" id="adminUsername" required autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="adminPassword" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const errorBox = document.getElementById('adminLoginError');
        errorBox.style.display = 'none';

        const username = document.getElementById('adminUsername').value.trim();
        const password = document.getElementById('adminPassword').value;

        try {
            const response = await fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok && result.message === 'logged in') {
                // Session cookie is set — hand off to the main site,
                // which will detect the admin session and show the panel.
                window.location.href = '/admin';
                return;
            }

            errorBox.textContent = result.message || 'Login failed. Please try again.';
            errorBox.style.display = 'block';

        } catch (error) {
            console.error('Admin login error:', error);
            errorBox.textContent = 'Could not reach the server. Please try again.';
            errorBox.style.display = 'block';
        }
    });
</script>

</body>
</html>
