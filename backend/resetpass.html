<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<!-- Font Awesome -->
<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>
        body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: linear-gradient(135deg, #171c26 0%, #2a3352 55%,  130%);
        padding: 20px;
    }
    </style>

</head>

<body>


<!-- ================= RESET PASSWORD ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <!-- Heading -->
                    <div class="text-center mb-4">

                        <i class="fas fa-lock text-primary fs-1 mb-3"></i>

                        <h3 class="fw-semibold">
                            Reset Password
                        </h3>

                        <p class="text-muted">
                            Enter your new password below.
                        </p>

                    </div>


                    <form id="resetPasswordForm">


                        <!-- New Password -->
                        <div class="mb-3">

                            <label for="password"
                                   class="form-label fw-medium">

                                New Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>

                                <input type="password"
                                       id="password"
                                       class="form-control"
                                       placeholder="Enter new password"
                                       required>

                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        id="passwordEye">

                                    <i class="fas fa-eye"></i>

                                </button>

                            </div>

                        </div>


                        <!-- Confirm Password -->
                        <div class="mb-3">

                            <label for="confirmPassword"
                                   class="form-label fw-medium">

                                Confirm Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>

                                <input type="password"
                                       id="confirmPassword"
                                       class="form-control"
                                       placeholder="Confirm new password"
                                       required>

                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        id="confirmEye">

                                    <i class="fas fa-eye"></i>

                                </button>

                            </div>

                        </div>


                        <!-- Error -->
                        <div id="errorMessage"
                             class="alert alert-danger d-none">

                        </div>


                        <!-- Success -->
                        <div id="successMessage"
                             class="alert alert-success d-none">

                            <i class="fas fa-check-circle me-2"></i>

                            Password reset successfully.

                        </div>


                        <!-- Button -->
                        <button type="submit"
                                class="btn btn-primary w-100 py-2">

                            <i class="fas fa-key me-2"></i>

                            Reset Password

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // Get elements
const password =
        document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirmPassword");

    const form =
        document.getElementById("resetPasswordForm");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");


    // Show / hide password

    document.getElementById("passwordEye")
        .addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                this.innerHTML =
                    '<i class="fas fa-eye-slash"></i>';

            } else {

                password.type = "password";

                this.innerHTML =
                    '<i class="fas fa-eye"></i>';

            }

        });


    // Show / hide confirm password

    document.getElementById("confirmEye")
        .addEventListener("click", function () {

            if (confirmPassword.type === "password") {

                confirmPassword.type = "text";

                this.innerHTML =
                    '<i class="fas fa-eye-slash"></i>';

            } else {

                confirmPassword.type = "password";

                this.innerHTML =
                    '<i class="fas fa-eye"></i>';

            }

        });


    // Form submit

    form.addEventListener("submit", async function (event) {

        const passwords =
        document.getElementById("password").value.trim();

    const confirmPasswords =
        document.getElementById("confirmPassword").value.trim();

        event.preventDefault();

        errorMessage.classList.add("d-none");
        successMessage.classList.add("d-none");


        // Check password length

        if (password.value.length < 8) {

            errorMessage.textContent =
                "Password must be at least 8 characters.";

            errorMessage.classList.remove("d-none");

            return;
        }


        // Check password match

        if (password.value !== confirmPassword.value) {

            errorMessage.textContent =
                "Passwords do not match.";

            errorMessage.classList.remove("d-none");

            return;
        }


        // Success


        let param = new URLSearchParams(window.location.search)
        let id = param.get('_id');
        console.log({id});

        const data = {
            id:id,
            pass:passwords,
        }

        const responce = await fetch('/changepass',{
            method:"POST",
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify(data),
        })

        let datas = await responce.json()
        if(datas.suc){
            successMessage.classList.remove("d-none");
            window.location = "landing.html";
        }else{
               errorMessage.textContent =
                `${datas.msg}`;
            alert(datas.msg)
            errorMessage.classList.remove("d-none");
        }
        
    });


</script>


</body>

</html>
