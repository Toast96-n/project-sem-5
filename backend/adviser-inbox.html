<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adviser Inbox — WiseFind</title>
<meta name="robots" content="noindex, nofollow">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    :root { --brand: #4e66ea; --brand-dark: #3648c4; }

    body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #f4f6fb;
        color: #171c26;
        height: 100vh;
        overflow: hidden;
    }

    /* ---------- Login gate ---------- */
    #loginGate {
        max-width: 380px;
        margin: 80px auto;
        background: #fff;
        padding: 32px;
        border-radius: 14px;
        box-shadow: 0 10px 40px rgba(0,0,0,.1);
    }
    #loginGate h2 { font-size: 1.3rem; margin-bottom: 4px; }
    #loginGate p.sub { color: #777; font-size: .88rem; margin-bottom: 20px; }
    #loginError {
        display: none;
        background: #fdecea; color: #b3261e;
        border-radius: 8px; padding: 8px 12px; font-size: .85rem; margin-bottom: 14px;
    }

    /* ---------- App shell ---------- */
    #app { display: none; height: 100vh; flex-direction: column; }

    .topbar {
        background: #171c26;
        color: #fff;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }
    .topbar h1 { font-size: 1.05rem; margin: 0; display: flex; align-items: center; gap: 10px; }
    .topbar h1 i { color: var(--brand); }

    .online-toggle { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
    .online-toggle .dot { width: 9px; height: 9px; border-radius: 50%; background: #999; display: inline-block; }
    .online-toggle input:checked ~ .dot { background: #2ecc71; }

    .logout-btn {
        background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff;
        padding: 5px 12px; border-radius: 8px; font-size: .8rem; cursor: pointer;
    }
    .logout-btn:hover { background: rgba(255,255,255,.1); }

    .body-split { flex: 1; display: flex; overflow: hidden; }

    /* ---------- Chat list (the "one button per chat" list) ---------- */
    .chat-list {
        width: 320px;
        flex-shrink: 0;
        background: #fff;
        border-right: 1px solid #eee;
        overflow-y: auto;
    }
    .chat-list h3 {
        font-size: .8rem; text-transform: uppercase; letter-spacing: .05em;
        color: #999; padding: 16px 16px 8px;
    }
    .chat-item {
        width: 100%; text-align: left; border: none; background: none;
        padding: 12px 16px; display: flex; align-items: center; gap: 10px;
        cursor: pointer; border-bottom: 1px solid #f2f2f2;
    }
    .chat-item:hover, .chat-item.active { background: #f0f2fa; }
    .chat-item .avatar {
        width: 38px; height: 38px; border-radius: 50%; background: var(--brand);
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-weight: 700; flex-shrink: 0;
    }
    .chat-item .meta { min-width: 0; }
    .chat-item .meta .name { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item .meta .sub { font-size: .75rem; color: #888; }
    .chat-item .new-badge {
        margin-left: auto; background: #ff4757; color: #fff; font-size: .68rem;
        padding: 2px 7px; border-radius: 10px; font-weight: 700;
    }
    .empty-hint { padding: 24px 16px; color: #999; font-size: .85rem; }

    /* ---------- Chat pane ---------- */
    .chat-pane { flex: 1; display: flex; flex-direction: column; background: #f8f9fd; }
    .chat-pane-header {
        padding: 14px 20px; background: #fff; border-bottom: 1px solid #eee;
        font-weight: 700; flex-shrink: 0;
    }
    .chat-pane-header .sub { font-weight: 400; color: #888; font-size: .8rem; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
    .chat-bubble {
        max-width: 60%; padding: 9px 14px; border-radius: 14px; margin-bottom: 10px;
        font-size: .9rem; line-height: 1.4; word-wrap: break-word;
    }
    .chat-bubble.mine { background: var(--brand); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
    .chat-bubble.theirs { background: #eee; color: #171c26; margin-right: auto; border-bottom-left-radius: 4px; }
    .chat-input-row { display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid #eee; flex-shrink: 0; }
    .chat-input-row input {
        flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 16px; font-size: .9rem;
    }
    .chat-input-row button {
        background: var(--brand); color: #fff; border: none; border-radius: 20px;
        padding: 0 20px; font-weight: 600; cursor: pointer;
    }
    .no-chat-selected {
        flex: 1; display: flex; align-items: center; justify-content: center;
        color: #999; font-size: .95rem; flex-direction: column; gap: 10px;
    }
</style>
</head>
<body>

<!-- ===================== LOGIN GATE ===================== -->
<div id="loginGate">
    <h2><i class="fas fa-headset text-primary me-2"></i>Adviser Login</h2>
    <p class="sub">Log in to see your incoming chats and reply to them.</p>
    <div id="loginError"></div>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="adviserEmail" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="adviserPassword" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app">
    <div class="topbar">
        <h1><i class="fas fa-headset"></i> <span id="adviserNameLabel">Adviser Inbox</span></h1>
        <div style="display:flex;align-items:center;gap:20px;">
            <label class="online-toggle">
                <input type="checkbox" id="onlineToggle" style="display:none;">
                <span class="dot"></span>
                <span id="onlineLabel">Offline</span>
            </label>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>

    <div class="body-split">
        <div class="chat-list">
            <h3>My Chats</h3>
            <div id="chatListBody"></div>
        </div>

        <div class="chat-pane" id="chatPane">
            <div class="no-chat-selected" id="noChatSelected">
                <i class="fas fa-comments" style="font-size:2rem;"></i>
                <p>Pick a chat on the left to start replying.</p>
            </div>
            <div id="activeChat" style="display:none; flex:1; display:flex; flex-direction:column;">
                <div class="chat-pane-header">
                    <span id="chatHeaderName">User</span>
                    <span class="sub" id="chatHeaderSub"></span>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="Type a reply...">
                    <button id="chatSendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let myId = null;
    let currentRequestId = null;
    let requests = [];

    function escapeHTML(str) {
        return String(str ?? '').replace(/[&<>"']/g, s => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[s]));
    }

    async function init() {
        try {
           const response = await fetch('/dashboard', {
    credentials: 'include',
    cache: 'no-store'
});
            if (response.ok) {
                const result = await response.json();
                if (result.role === 'adviser') {
                    enterApp(result.user);
                    return;
                }
            }
        } catch (error) {
            // fall through to login gate
        }
        document.getElementById('loginGate').style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const errorBox = document.getElementById('loginError');
        errorBox.style.display = 'none';

        const email = document.getElementById('adviserEmail').value.trim();
        const password = document.getElementById('adviserPassword').value;

        try {
            const response = await fetch('/adviser/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email, password })
            });
            const result = await response.json();

          if (response.ok && result.message === 'logged in') {
    enterApp(result.user);
    return;
}

            errorBox.textContent = result.message || 'Login failed.';
            errorBox.style.display = 'block';
        } catch (error) {
            errorBox.textContent = 'Could not reach the server.';
            errorBox.style.display = 'block';
        }
    });

    function enterApp(user) {
    myId = user.id || user._id;

    // Hide login screen
    document.getElementById('loginGate').style.display = 'none';

    // Show adviser application
    document.getElementById('app').style.display = 'flex';

    // Set adviser information
    document.getElementById('adviserNameLabel').textContent =
        user.name || 'Adviser Inbox';

    // Set online status
    setOnlineUI(!!user.isOnline);

    // Connect socket
    connectSocket();

    // Load chats
    loadChats();
}

    function setOnlineUI(isOnline) {
        document.getElementById('onlineToggle').checked = isOnline;
        document.getElementById('onlineLabel').textContent = isOnline ? 'Online' : 'Offline';
        document.querySelector('.online-toggle .dot').style.background = isOnline ? '#2ecc71' : '#999';
    }

    document.querySelector('.online-toggle').addEventListener('click', async () => {
        const next = !document.getElementById('onlineToggle').checked;
        setOnlineUI(next);
        await fetch('/adviser/status', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ isOnline: next })
        });
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/logout', { method: 'POST', credentials: 'include' });
        window.location.reload();
    });

    function connectSocket() {
        socket = io({ withCredentials: true });

        socket.on('connect', () => {
            if (currentRequestId) {
                socket.emit('join_request', { requestId: currentRequestId });
            }
        });

        socket.on('chat_history', (messages) => {
            const box = document.getElementById('chatMessages');
            box.innerHTML = '';
            messages.forEach(renderMessage);
            box.scrollTop = box.scrollHeight;
        });

        socket.on('receive_message', (message) => {
            if (String(message.requestId) !== String(currentRequestId)) return;
            renderMessage(message);
            const box = document.getElementById('chatMessages');
            box.scrollTop = box.scrollHeight;
        });

        // One incoming chat notification, live, no refresh needed.
        socket.on('new_advice_request', () => {
            loadChats();
        });
    }

    function renderMessage(message) {
        const box = document.getElementById('chatMessages');
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble ' + (message.senderRole === 'adviser' ? 'mine' : 'theirs');
        bubble.textContent = message.text;
        box.appendChild(bubble);
    }

    async function loadChats() {
      const response = await fetch('/advice/mine', {
    credentials: 'include',
    cache: 'no-store'
});
        if (!response.ok) return;
        const data = await response.json();
        requests = data.requests || [];
        renderChatList();
    }

    function renderChatList() {
        const body = document.getElementById('chatListBody');
        body.innerHTML = '';

        if (requests.length === 0) {
            body.innerHTML = '<div class="empty-hint">No chats yet. They will show up here the moment a user reaches out.</div>';
            return;
        }

        requests.forEach(request => {
            const userName = request.userId ? request.userId.username : 'User';
            const item = document.createElement('button');
            item.className = 'chat-item' + (String(request._id) === String(currentRequestId) ? ' active' : '');
            item.innerHTML = `
                <div class="avatar">${escapeHTML(userName.charAt(0).toUpperCase())}</div>
                <div class="meta">
                    <div class="name">${escapeHTML(userName)}</div>
                    <div class="sub">${escapeHTML(request.category || 'general')} &middot; ${new Date(request.createdAt).toLocaleDateString()}</div>
                </div>
            `;
            item.addEventListener('click', () => openChat(request._id, userName, request.category));
            body.appendChild(item);
        });
    }

    function openChat(requestId, userName, category) {
        currentRequestId = requestId;
        renderChatList();

        document.getElementById('noChatSelected').style.display = 'none';
        document.getElementById('activeChat').style.display = 'flex';
        document.getElementById('chatHeaderName').textContent = userName;
        document.getElementById('chatHeaderSub').textContent = category ? ` · ${category}` : '';
        document.getElementById('chatMessages').innerHTML = '';

        if (socket && socket.connected) {
            socket.emit('join_request', { requestId });
        }
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentRequestId || !socket) return;
        socket.emit('send_message', { requestId: currentRequestId, text });
        input.value = '';
    }

    document.getElementById('chatSendBtn').addEventListener('click', sendMessage);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    init();
</script>

</body>
</html>
